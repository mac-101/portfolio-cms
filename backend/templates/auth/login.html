{% extends "base.html" %}
{% block title %}Log in · Portfolio CMS{% endblock %}

{% block body %}
<div class="flex min-h-full items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <h1 class="mb-6 text-xl font-semibold tracking-tight">Log in</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for error in form.non_field_errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="w-full rounded-md bg-neutral-900 px-3 py-2 text-sm font-medium text-white hover:bg-neutral-800">Log in</button>
    </form>

    <p class="mt-6 text-sm text-neutral-600">New here? <a href="{% url 'signup' %}" class="font-medium text-neutral-900 underline">Create an account</a></p>
  </div>
</div>
{% endblock %}
