<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Server error · My Portfolio CMS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
  <script>
    (() => {
      const dark = localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
</head>
<body class="h-full bg-white text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
  <main class="relative flex min-h-full items-center justify-center px-4 py-12">
    <button id="theme-toggle-500" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle color theme"
            class="absolute right-4 top-4 inline-flex h-9 w-9 items-center justify-center rounded-md border border-neutral-300 bg-white text-neutral-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:ring-offset-2 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-200 dark:focus-visible:ring-neutral-100 dark:focus-visible:ring-offset-neutral-950"
            onclick="const dark = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', dark); document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; localStorage.setItem('theme', dark ? 'dark' : 'light'); this.setAttribute('aria-pressed', String(dark)); this.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');">
      <svg aria-hidden="true" class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/>
      </svg>
      <svg aria-hidden="true" class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="4"/>
        <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
      </svg>
    </button>
    <div class="w-full max-w-md text-center">
      <p class="text-sm font-medium text-neutral-500 dark:text-neutral-400">500</p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight">Something went wrong</h1>
      <p class="mt-3 text-sm text-neutral-600 dark:text-neutral-400">We couldn’t complete your request. Please try again in a moment.</p>
      <a href="/dashboard/" class="mt-6 inline-flex rounded-md bg-neutral-900 px-4 py-2 text-sm font-medium text-white hover:bg-neutral-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:ring-offset-2 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-white dark:focus-visible:ring-neutral-100 dark:focus-visible:ring-offset-neutral-950">Back to dashboard</a>
    </div>
  </main>
  <script>
    const themeToggle = document.getElementById("theme-toggle-500");
    const darkThemeEnabled = document.documentElement.classList.contains("dark");
    themeToggle.setAttribute("aria-pressed", String(darkThemeEnabled));
    themeToggle.setAttribute("aria-label", darkThemeEnabled ? "Switch to light mode" : "Switch to dark mode");
  </script>
</body>
</html>
